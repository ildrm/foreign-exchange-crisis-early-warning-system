[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-cpm"
version = "0.1.0"
description = "Regime-aware, multi-hazard probabilistic crisis early-warning research system"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Shahin ILDEREMI"}]
keywords = ["foreign-exchange", "crisis", "early-warning", "calibration", "backtesting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]
pdf = ["playwright>=1.49,<2"]

[project.scripts]
fx-cpm = "fx_cpm.presentation.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["fx_cpm*"]

[tool.setuptools.package-data]
"fx_cpm.presentation" = ["templates/*.html", "assets/*.css", "assets/*.js"]

[tool.setuptools.data-files]
"share/fx-cpm/schemas" = ["schemas/report.schema.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: cross-module integration test",
  "regression: deterministic report regression test",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
